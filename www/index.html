<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دوّن</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3QgeD0iNCIgeT0iNCIgd2lkdGg9IjU2IiBoZWlnaHQ9IjU2IiByeD0iMTYiIGZpbGw9IiMyNTYzZWIiLz48cGF0aCBkPSJNMTkgMzJoMjZtLTEzLTEzIDEzIDEzLTEzIDEzIiBmaWxsPSJub25lIiBzdHJva2U9IndoaXRlIiBzdHJva2Utd2lkdGg9IjYiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIvPjwvc3ZnPg==">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
    --bg:#f2f5f7;--glow:#d9e2ff;--s1:#ffffff;--s2:#e9eef2;--tx:#0b1620;--mu:#5b6b78;--bd:#dbe3e9;
    --ac:#2563eb;--ac-tx:#ffffff;--ac-soft:#dbe7ff;--warn:#b45309;--warn-soft:#fdecc8;--dng:#be123c;--dng-soft:#fde0e6;--ok:#047857;
    --sh:0 1px 2px rgba(11,22,32,.06),0 10px 30px rgba(11,22,32,.07);
    box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
    scroll-padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
        --bg:#020617;--glow:#1e1b4b;--s1:#111c33;--s2:#1b2744;--tx:#f8fafc;--mu:#94a3b8;--bd:rgba(255,255,255,.1);
        --ac:#3b82f6;--ac-tx:#ffffff;--ac-soft:#172554;--warn:#fbbf24;--warn-soft:#33270a;--dng:#fb7185;--dng-soft:#3a1019;--ok:#34d399;
        --sh:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    }
}
:root[data-theme="dark"]{
    --bg:#020617;--glow:#1e1b4b;--s1:#111c33;--s2:#1b2744;--tx:#f8fafc;--mu:#94a3b8;--bd:rgba(255,255,255,.1);
    --ac:#3b82f6;--ac-tx:#ffffff;--ac-soft:#172554;--warn:#fbbf24;--warn-soft:#33270a;--dng:#fb7185;--dng-soft:#3a1019;--ok:#34d399;
    --sh:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg) radial-gradient(circle at top right,var(--tglow,var(--glow)),transparent 62%) no-repeat;color:var(--tx);font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;font-size:15px;line-height:1.6;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px}
.top h1{font-size:22px;font-weight:700;margin:0}
.top .sub{color:var(--mu);font-size:13px}
.main{flex:1;overflow-y:auto;padding:10px 16px 24px}
.i{flex:none;display:block}

/* tabs */
.tabs{display:flex;gap:10px;padding:14px 16px 6px}
.tab{display:flex;align-items:center;justify-content:center;gap:7px;height:52px;border-radius:18px;font-weight:700;font-size:14.5px;color:var(--mu);background:color-mix(in srgb,var(--s1) 70%,transparent);border:1px solid var(--bd);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tab.big{flex:1}
.tab.sq{width:52px;flex:none}
.tab.on{background:var(--ac);color:var(--ac-tx);border-color:transparent;box-shadow:0 6px 22px color-mix(in srgb,var(--ac) 45%,transparent)}
.badge{background:#ef4444;color:#fff;font-size:12px;min-width:22px;height:22px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}

/* surfaces */
.card{background:color-mix(in srgb,var(--s1) 78%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;font-weight:600}
.row{display:flex;align-items:center;gap:12px}
.sp{flex:1}
.mu{color:var(--mu)}
.sm{font-size:12.5px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.empty{text-align:center;color:var(--mu);padding:34px 10px}
.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:4px}

.hero{padding:20px 18px}
.hero .big{font-size:40px;font-weight:700;line-height:1.1;margin:4px 0 2px}
.hero .big small{font-size:16px;color:var(--mu);font-weight:500;margin-inline-start:6px}
.bar{height:10px;background:var(--s2);border-radius:99px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px}
.bar i.hot{background:var(--dng)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:14px;font-weight:600;background:var(--s2);color:var(--tx)}
.btn.primary{background:var(--ac);color:var(--ac-tx)}
.btn.danger{background:var(--dng-soft);color:var(--dng)}
.btn.big{width:100%;padding:15px;font-size:16px}
.ib{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--mu);background:var(--s2)}
.ib.dng{color:var(--dng)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--s2)}
.chip.ok{background:var(--ac-soft);color:var(--ac)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.danger{background:var(--dng-soft);color:var(--dng)}

/* list rows */
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--bd)}
.item:first-of-type{border-top:0}
.ico{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.item .t{font-weight:600;line-height:1.3}
.item .m{font-size:12.5px;color:var(--mu)}
.item .a{font-weight:700;text-align:end}

/* numpad */
.amt{text-align:center;padding:18px 0 6px}
.amt .v{font-size:56px;font-weight:700;line-height:1.1}
.amt .v small{font-size:18px;color:var(--mu);font-weight:500;margin-inline-start:8px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr;margin:14px 0}
.pad button{height:60px;border-radius:18px;background:var(--s1);border:1px solid var(--bd);font-size:24px;font-weight:600;display:flex;align-items:center;justify-content:center}
.pad button:active{background:var(--s2)}

/* bubble map */
.map{--r:min(33vw,150px);position:relative;height:400px;direction:ltr;margin-top:6px}
.ray{position:absolute;left:50%;top:50%;width:var(--r);height:0;border-top:2px dashed rgba(148,163,184,.35);transform-origin:0 0;transform:rotate(var(--a))}
.node{position:absolute;left:50%;top:50%;width:84px;height:84px;transform:translate(calc(-50% + var(--cx) * var(--r)),calc(-50% + var(--cy) * var(--r)))}
.node.mid{width:124px;height:124px;transform:translate(-50%,-50%)}
.bub{width:100%;height:100%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;direction:rtl;color:#fff;
    background:linear-gradient(145deg,var(--c),var(--c2));border:1px solid rgba(255,255,255,.28);
    box-shadow:0 8px 22px color-mix(in srgb,var(--c) 38%,transparent),inset 0 0 14px rgba(255,255,255,.22);
    animation:pop .35s cubic-bezier(.2,.9,.3,1.3) backwards;animation-delay:var(--d,0s)}
.bub .e{font-size:26px;line-height:1;display:flex}
.bub .l{font-size:12px;font-weight:600;line-height:1.2;text-align:center;padding:0 6px;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.mid .bub .l{font-size:14px;font-weight:700}
.mid .bub .e{font-size:34px}
.amt-chip{margin-top:2px;background:rgba(2,6,23,.5);padding:1px 10px;border-radius:99px;font-size:12.5px}
.bub.root{box-shadow:0 0 34px rgba(59,130,246,.55),inset 0 0 18px rgba(255,255,255,.25)}
.bub.pulse{animation:pulse 2.2s ease-in-out infinite}
.bub:active{transform:scale(.94)}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
@keyframes pulse{50%{transform:scale(1.06)}}
.mback{position:absolute;top:0;right:4px;width:40px;height:40px;border-radius:50%;background:var(--s2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--tx);z-index:2}
.trail{display:flex;align-items:center;justify-content:center;gap:0;margin:4px 0 0}
.trail i{width:16px;border-top:2px dashed rgba(148,163,184,.45)}
.tn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;background:linear-gradient(145deg,var(--c),var(--c2));border:1px solid rgba(255,255,255,.28)}
.hint{text-align:center;color:var(--mu);margin:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:6px 0}
.grid .node{position:static;transform:none;width:auto;height:96px}
.grid .bub{border-radius:22px}
@media (prefers-reduced-motion:reduce){.bub,.bub.pulse{animation:none}}

/* stats */
.donut{width:150px;height:150px;border-radius:50%;position:relative;flex:none}
.donut::after{content:'';position:absolute;inset:26px;border-radius:50%;background:var(--s1)}
.donut b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1;font-size:15px}
.legend{flex:1;min-width:0}
.lg{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13.5px}
.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.cols{display:flex;align-items:flex-end;gap:10px;height:120px;direction:ltr;margin-top:6px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:11px;color:var(--mu)}
.col i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--s2);min-height:4px}
.col.on i{background:var(--ac)}

/* settings */
.crow{display:flex;align-items:center;gap:8px;padding:6px 0;padding-inline-start:calc(var(--d) * 18px)}
.crow b{font-weight:500}
.ce{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.set{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--bd)}
.set:first-of-type{border-top:0}
.set .d{font-size:12.5px;color:var(--mu)}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:13px;color:var(--mu);margin-bottom:5px}
.in{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);outline-offset:0}
.in:focus{border-color:var(--ac)}
textarea.in{min-height:150px;direction:ltr;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.sw{position:relative;flex:none;cursor:pointer}
.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw span{display:block;width:46px;height:26px;border-radius:99px;background:var(--bd);position:relative;transition:background .2s}
.sw span::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:inset-inline-start .2s}
.sw input:checked+span{background:var(--ac)}
.sw input:checked+span::after{inset-inline-start:23px}
.sw input:focus-visible+span{outline:2px solid var(--ac);outline-offset:2px}
.swatches,.emojis{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.swatch.on{border-color:var(--tx)}
.em{width:38px;height:38px;border-radius:10px;background:var(--s2);font-size:19px}
.pack{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--bd)}
.pack:first-of-type{border-top:0}

/* modal + toast + lock */
#modal{position:fixed;inset:0;z-index:50;display:none}
#modal.open{display:block}
.ov{position:absolute;inset:0;background:rgba(3,10,16,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:92%;overflow-y:auto;background:var(--s1);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
.sheet h3{margin:0 0 14px;font-size:18px}
.sheet .acts{display:flex;gap:10px;margin-top:16px}
.sheet .acts .btn{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#toast{position:fixed;inset-inline:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:60}
#toast div{background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;box-shadow:var(--sh);animation:up .2s}
.lock{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.dots{display:flex;gap:14px;margin:18px 0 8px;direction:ltr}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--mu)}
.dots i.f{background:var(--tx);border-color:var(--tx)}
.dots.bad i{border-color:var(--dng);background:var(--dng)}
.lock .pad{width:100%;max-width:300px}
/* ===== v4: bottom nav, orbit controls, alerts, دوّن ===== */
.tabs{align-items:center}
.seg{flex:1;display:flex;gap:4px;padding:5px;border-radius:22px;border:1px solid var(--bd);background:color-mix(in srgb,var(--s1) 70%,transparent);min-width:0}
.seg .tab{flex:1;height:44px;border:0;background:transparent;border-radius:17px;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0 6px;min-width:0}
.seg .tab.on{background:var(--ac);color:var(--ac-tx);box-shadow:0 6px 20px color-mix(in srgb,var(--ac) 45%,transparent)}
.tab.sq{background:color-mix(in srgb,var(--s1) 70%,transparent);color:var(--ac)}
.tab.sq.on{background:var(--ac);color:var(--ac-tx)}
.bnav{display:flex;padding:6px 6px 8px;background:color-mix(in srgb,var(--s1) 94%,transparent);border-top:1px solid var(--bd)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mu);font-size:12px;font-weight:600;padding:6px 4px;position:relative}
.bnav button.on{color:var(--ac)}
.bnav button.on::after{content:'';position:absolute;bottom:-1px;width:6px;height:6px;border-radius:50%;background:var(--ac)}
.main{padding-bottom:18px}

.pbar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:20px;border:1px solid var(--bd);background:color-mix(in srgb,var(--s1) 70%,transparent)}
.pb-back{width:38px;height:38px;border-radius:50%;background:var(--s2);display:flex;align-items:center;justify-content:center;color:var(--tx);flex:none}
.pb-back:disabled{opacity:.35}
.pchip{display:inline-flex;align-items:center;gap:8px;background:var(--ac);color:var(--ac-tx);padding:8px 16px;border-radius:99px;font-weight:700;max-width:62%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pchip i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.75);flex:none}
.lvl{display:inline-flex;align-items:center;gap:6px;background:var(--s2);padding:5px 12px;border-radius:99px;font-size:13px;color:var(--tx);flex:none}

.map{--r:calc(min(33vw,150px) * var(--z,1));height:410px;overflow:hidden}
.ring{position:absolute;left:50%;top:50%;width:calc(var(--r) * 2);height:calc(var(--r) * 2);transform:translate(-50%,-50%);border:1px dashed rgba(148,163,184,.28);border-radius:50%;pointer-events:none}
.bub{position:relative}
.bub>*{position:relative}
.bub::before{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 30% 18%,rgba(255,255,255,.42),transparent 55%);pointer-events:none}
.bub .l{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.orb{position:absolute;left:50%;bottom:-5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#cbd5e1;border:2px solid rgba(255,255,255,.55);pointer-events:none}
.cn{min-width:22px;height:22px;border-radius:50%;background:rgba(2,6,23,.45);font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.bub.or{box-shadow:0 0 34px rgba(245,158,11,.5),inset 0 0 18px rgba(255,255,255,.25)}

.ctls{display:flex;gap:10px;margin-top:8px;align-items:stretch}
.rotp{flex:1;display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:22px;border:1px solid var(--ac);background:color-mix(in srgb,var(--s1) 70%,transparent);min-width:0}
.rotp b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rimg{width:40px;height:40px;border-radius:50%;background:var(--s2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--mu)}
.zp{direction:ltr;display:flex;align-items:center;gap:4px;padding:7px 10px;border-radius:22px;border:1px solid var(--bd);background:color-mix(in srgb,var(--s1) 70%,transparent);flex:none}
.zp .ib{background:none;color:var(--tx);width:32px}
.pp{width:42px;height:42px;border-radius:50%;background:var(--s2);color:var(--tx);display:flex;align-items:center;justify-content:center}
.pp.on{background:var(--ac);color:var(--ac-tx)}
.rv{color:var(--ac);font-weight:700;padding:0 6px}

.big2{font-size:30px;font-weight:700;line-height:1.2}
.acard.urgent{border-color:color-mix(in srgb,var(--dng) 65%,var(--bd))}
.at{font-size:17px}
.rd{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ok)}
.rd.neg{color:var(--dng)}
.pay{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:14px;background:var(--ac);color:var(--ac-tx);font-weight:700;margin-inline-start:8px}

.btn.or{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#2b1700}
.chip-or{display:inline-flex;align-items:center;background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);padding:3px 12px;border-radius:99px;font-size:13px;font-weight:600}
.chip-or.big{font-size:15px;padding:8px 18px;background:#f59e0b;color:#2b1700;border:0;font-weight:700}
.dwi{width:46px;height:46px;border-radius:16px;background:linear-gradient(145deg,#fbbf24,#f59e0b);color:#2b1700;display:flex;align-items:center;justify-content:center;flex:none}
.dwh{display:flex;align-items:center;gap:12px}
.dwt{margin:0;font-size:24px}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--mu);display:flex;align-items:center;justify-content:center;color:#fff;flex:none;margin-top:2px}
.ck.on{background:var(--ok);border-color:var(--ok)}
.dwcard.done .t{text-decoration:line-through;opacity:.6}
.attbox{border:1px solid var(--bd);border-radius:20px;padding:14px;background:color-mix(in srgb,var(--s2) 40%,transparent)}
.att{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--bd);border-radius:14px;margin-top:8px}
.att .an{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai.image{color:#60a5fa}.ai.pdf{color:#fbbf24}.ai.audio{color:#f472b6}
.btn.danger{background:var(--dng-soft);color:var(--dng)}
.vt{font-size:22px;margin:6px 2px 12px}
select.in{appearance:auto}
@media (prefers-reduced-motion:reduce){.pp.on{}}
/* ===== v5 ===== */
.tab{position:relative}
.tab .ul{position:absolute;bottom:4px;left:28%;right:28%;height:2px;border-radius:2px;background:var(--dng)}
.pstrip{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:20px;border:1px solid var(--bd);background:color-mix(in srgb,var(--s1) 70%,transparent);margin-top:2px}
.pchip2{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:99px;border:1px solid var(--ac);color:var(--ac);background:var(--ac-soft);font-weight:700;font-size:13.5px;flex:none}

async function smp(){if(_smp!==undefined)return _smp;try{_smp=(window.claude&&window.claude.use)?await window.claude.use('sample'):null}catch(e){_smp=null}if(!_smp&&S.settings.aiKey)_smp=apiSampler();return _smp}
/* اتصال مباشر بـ Claude API بمفتاح المستخدم (لتطبيق APK والمتصفح العادي) */
function apiSampler(){
 const call=async prompt=>{
    let r;
    try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.settings.aiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:S.settings.aiModel||'claude-haiku-4-5-20251001',max_tokens:1024,messages:[{role:'user',content:prompt}]})})}
    catch(e){throw {code:'network'}}
    if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}throw {code:r.status===401?'bad_key':r.status===429?'rate_limited':'api_error',message:m}}
    const d=await r.json();return (d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
 };
 const f=async p=>({text:await call(p),truncated:false});
 f.json=async p=>{const t=await call(p+'\n\nأجب بـ JSON صالح فقط دون أي نص آخر.'),c=t.replace(/```json|```/g,'').trim(),i=c.indexOf('{'),j=c.lastIndexOf('}');try{return JSON.parse(i>-1?c.slice(i,j+1):c)}catch(e){throw {code:'bad_json'}}};
 return f;
}
function aiCard(){
 const s=S.settings,on=!!s.aiKey,md=s.aiModel||'claude-haiku-4-5-20251001';
 return '<div class="card"><h2>'+svg('sparkle',16)+' الذكاء الاصطناعي</h2><div class="mu sm" style="margin:-4px 0 10px">داخل تطبيق Claude يعمل تلقائياً بحسابك. في تطبيق الجوال (APK) أو المتصفح العادي أضف مفتاح Claude API من console.anthropic.com. يُحفظ المفتاح على هذا الجهاز فقط ولا يدخل في النسخة الاحتياطية، وتُحتسب تكلفة الاستخدام على حسابك في Anthropic.</div>'
 +'<div class="fld"><span>مفتاح API</span><div class="pwrow"><input class="in" id="ai-key" type="password" autocomplete="off" placeholder="sk-ant-..." value="'+esc(s.aiKey||'')+'" style="direction:ltr;text-align:start"><button class="ib" data-a="pwShow" data-for="ai-key" aria-label="إظهار">'+svg('eye',18)+'</button></div></div>'
 +'<label class="fld"><span>النموذج</span><select class="in" id="ai-model">'+[['claude-haiku-4-5-20251001','Claude Haiku 4.5 (سريع واقتصادي)'],['claude-sonnet-5-5','Claude Sonnet 5.5 (أدق)']].map(m=>'<option value="'+m[0]+'"'+(md===m[0]?' selected':'')+'>'+m[1]+'</option>').join('')+'</select></label>'
 +'<div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn primary sp" data-a="aiSave">حفظ</button><button class="btn sp" data-a="aiTest">اختبار الاتصال</button>'+(on?'<button class="btn danger" data-a="aiClear">حذف المفتاح</button>':'')+'</div><div class="sm" id="ai-st" style="margin-top:8px;color:'+(on?'var(--ok)':'var(--mu)')+'">'+(on?'✓ المفتاح محفوظ على هذا الجهاز':'غير مفعّل خارج تطبيق Claude')+'</div></div>';
}
async function aiJson(prompt){const s=await smp();if(!s)throw {code:'absent'};return await s.json(prompt,{modelTier:'quick'})}
const aiCtx=c=>c==='m'?'تطبيق لحفظ البيانات الشخصية الحساسة والتقنية مثل كلمات المرور والحسابات والأجهزة والوثائق':c==='d'?'تطبيق لبناء الأفكار والمهام والمشاريع ومتابعة تنفيذها':'تطبيق لتتبع المصروفات الشخصية';
async function aiChildren(ctx,label,existing){
 const r=await aiJson('أنت مساعد داخل '+aiCtx(ctx)+'. القسم: «'+label+'». اقترح من 6 إلى 8 تفريعات فرعية مناسبة لهذا القسم بالعربية، ولكل تفريع إيموجي واحد مناسب. لا تكرر هذه الأسماء: '+(existing.join('، ')||'لا يوجد')+'. أجب بـ JSON فقط بهذا الشكل: {"children":[{"name":"...","emoji":"..."}]}');
 return (r&&r.children||[]).map(x=>({n:String(x.name||'').trim().slice(0,30),e:String(x.emoji||'').slice(0,4)||null})).filter(x=>x.n);
}
async function aiFields(ctx,label){
 const r=await aiJson('أنت مساعد داخل '+aiCtx(ctx)+'. القسم: «'+label+'». اقترح من 2 إلى 5 حقول إدخال مناسبة لنموذج تعبئة بيانات هذا القسم'+(ctx==='p'?' (النموذج يتضمن مسبقاً المبلغ ونوع الصرف والتاريخ والملاحظة، فلا تكررها)':'')+'. الأنواع المسموحة فقط: text, number, date, password, email, url, textarea. أجب بـ JSON فقط: {"fields":[{"label":"...","type":"text"}]}');
 return (r&&r.fields||[]).map(x=>({label:String(x.label||'').trim().slice(0,30),type:FT[x.type]?x.type:'text'})).filter(x=>x.label);
}
const aiErr=e=>{const c=e&&e.code;return c==='not_granted'?'لم تسمح باستخدام الذكاء الاصطناعي':c==='absent'?'الذكاء الاصطناعي غير مفعّل: أضف مفتاح Claude API من الحساب':c==='bad_key'?'مفتاح API غير صحيح':c==='network'?'تعذّر الاتصال بخادم Claude، تحقق من الإنترنت':c==='rate_limited'?'طلبات كثيرة، حاول بعد قليل':c==='bad_json'?'وصل رد غير متوقع، حاول مرة أخرى':c==='api_error'?'خطأ من الخادم: '+(e.message||'غير معروف'):'تعذّر الحصول على اقتراحات الآن'};

/* ---------- إضافة عدة تفريعات مع اقتراحات ---------- */
const parseNames=t=>{const o=[],seen=new Set();String(t||'').split(/[\n,،;؛]+/).forEach(x=>{x=x.trim().slice(0,30);if(x&&!seen.has(x)){seen.add(x);o.push(x)}});return o};
function multiModal(ctx,par){
 const pn=par?tnode(ctx,par):null,existing=(pn?(pn.children||[]):TREE(ctx)).map(x=>x.label);
 ui.mb={ctx,par,ex:existing,sug:suggestFor(ctx,pn?pn.label:'',existing),ico:{}};
 ui.mb.sug.forEach(s=>{ui.mb.ico[s.n]=s.e});
 modal('<h3>'+(pn?'إضافة تفريعات إلى «'+esc(pn.label)+'»':'إضافة تفريعات')+'</h3><div class="mu sm" style="margin-bottom:8px">اكتب كل تفريع في سطر أو افصل بينها بفاصلة، أو اضغط على اقتراح لإضافته. تُختار الأيقونة تلقائياً من الاسم.</div><div id="mb-sug" class="sugs"></div><button class="btn" id="mb-ai" data-a="mbAi" style="margin:10px 0">'+svg('sparkle',16)+' اقتراح ذكي</button><textarea class="in" id="mb-names" data-in="mbInput" style="min-height:90px;direction:rtl;font-family:inherit;font-size:15px" placeholder="مثال: خضار وفواكه، لحوم، ألبان"></textarea><div id="mb-prev" class="prevs"></div><div class="acts"><button class="btn" data-a="close">إلغاء</button><button class="btn primary" id="mb-save" data-a="mbSave">إضافة</button></div>');
 mbRender();
 
}
function mbRender(){
 const m=ui.mb,ta=$('#mb-names');if(!m||!ta)return;
 const names=parseNames(ta.value),set=new Set(names);
 $('#mb-sug').innerHTML=m.sug.map(s=>'<button class="sug'+(set.has(s.n)?' on':'')+'" data-a="mbPick" data-n="'+esc(s.n)+'">'+esc(s.e||iconFor(s.n)||'🔖')+' '+esc(s.n)+'</button>').join('');
 $('#mb-prev').innerHTML=names.map(n=>'<span class="pv"><b>'+esc(m.ico[n]||iconFor(n)||'🔖')+'</b>'+esc(n)+(m.ex.indexOf(n)>-1?' <i class="mu">(موجود)</i>':'')+'</span>').join('');
 const k=names.filter(n=>m.ex.indexOf(n)<0).length,b=$('#mb-save');if(b)b.textContent=k?'إضافة '+k+(k===1?' تفريع':k<11?' تفريعات':' تفريعاً'):'إضافة';
}

 sortedRem().filter(r=>daysLeft(r.due)<=7).slice(0,3).forEach(r=>{const d=daysLeft(r.due);L.push({t:'تنبيه: '+r.label+' ('+fmt(r.amount)+' '+cur()+') - '+remTxt(d),l:d<=2?'high':'mid'})});

const wait=ms=>new Promise(r=>setTimeout(r,ms));

async function ticker(){
 if(tk.run)return;tk.run=true;
 const calm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 for(;;){
    try{
      const el=$('#tip');
      if(!el||!el.animate){await wait(900);continue}
      const L=tipsFor(ui.view),M=L[tk.i%L.length]||{t:'',l:'low'};el.textContent=M.t;setDot(M.l);
      el.getAnimations().forEach(a=>a.cancel());
      const over=Math.max(0,el.scrollWidth-el.parentElement.clientWidth);
      if(calm){await wait(4500+over*25)}
      else{
        await el.animate([{transform:'translateX(-120%)',opacity:0},{transform:'translateX(0)',opacity:1}],{duration:1000,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'}).finished.catch(()=>{});
        await wait(1400);
        if(over>0){await el.animate([{transform:'translateX(0)'},{transform:'translateX('+over+'px)'}],{duration:over*30+600,easing:'linear',fill:'forwards'}).finished.catch(()=>{});await wait(1200)}
        else await wait(2800);
        await el.animate([{opacity:1},{opacity:0}],{duration:700,fill:'forwards'}).finished.catch(()=>{});
      }
      const dot=$('#tipdot');if(dot)dot.classList.add('blink');
      await wait(1300);
      const d2=$('#tipdot');if(d2)d2.classList.remove('blink');
      tk.i++;
    }catch(e){await wait(1000)}
 }
}

/* ---------- النصائح والتقارير المفصلة ---------- */
const monthRows=m=>S.history.filter(h=>ym(h.date)===m);
const topOf=h=>{const t=trail(h.catId);return t?t[0]:{id:'x',label:h.label||'أخرى',icon:h.icon||'•',color:h.color||'#64748b'}};
function spendAdvice(m){
 const A=[],rows=monthRows(m),tot=rows.reduce((a,h)=>a+h.amount,0),bud=+S.settings.budget||0;
 if(!tot)return A;
 if(bud){if(tot>bud)A.push(['high','تجاوزت الميزانية الشهرية ('+fmt(bud)+') بمبلغ '+fmt(tot-bud)+'. راجع المصروفات غير الضرورية وأجّل المشتريات الكمالية إلى الشهر القادم.']);else if(tot>bud*.85)A.push(['mid','وصلت إلى '+Math.round(tot/bud*100)+'% من ميزانيتك. خفّف الصرف حتى نهاية الشهر.'])}
 const d=new Date(m+'-15T12:00:00'),prev=[];for(let i=1;i<=3;i++){d.setMonth(d.getMonth()-1);const t=monthRows(ym(dstr(d))).reduce((a,h)=>a+h.amount,0);if(t>0)prev.push(ym(dstr(d)))}
 const avg=prev.length?prev.reduce((a,pm)=>a+monthRows(pm).reduce((x,h)=>x+h.amount,0),0)/prev.length:0;
 if(avg&&tot>avg*1.2)A.push([tot>avg*1.5?'high':'mid','صرفك هذا الشهر أعلى من متوسطك المعتاد ('+fmt(avg)+') بنسبة '+Math.round((tot/avg-1)*100)+'%. هذا أعلى من الحد المعقول لنمط صرفك.']);
 const by={};rows.forEach(h=>{const c=topOf(h);(by[c.label]=by[c.label]||{c,s:0}).s+=h.amount});
 Object.values(by).forEach(x=>{
    const share=x.s/tot;if(share>.4&&Object.keys(by).length>1)A.push(['mid','قسم «'+x.c.label+'» يستهلك '+Math.round(share*100)+'% من مصروفك هذا الشهر. حاول وضع سقف خاص له.']);
    if(prev.length){const pa=prev.reduce((a,pm)=>a+monthRows(pm).filter(h=>topOf(h).label===x.c.label).reduce((s,h)=>s+h.amount,0),0)/prev.length;if(pa>0&&x.s>pa*1.5&&x.s-pa>50)A.push(['mid','مصروف «'+x.c.label+'» ارتفع '+Math.round((x.s/pa-1)*100)+'% عن متوسطه ('+fmt(pa)+').'])}
 });
 if(!A.length)A.push(['low','صرفك هذا الشهر ضمن الحدود المعقولة. استمر على هذا النمط 👍']);
 return A;
}
